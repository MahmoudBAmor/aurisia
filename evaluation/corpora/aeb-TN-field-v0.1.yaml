# Initial phrases supplied during desktop testing. References are deliberately
# separate from prompts so spelling and display policy can evolve without
# renaming private local recordings.
cases:
  - id: return_quickly
    prompt_arabizi: "kifech aamelt bech tarja3 fissa3"
    reference_arabic: "كيفاش عملت باش ترجع فيسع"
    code_switch_terms: []

  - id: welcome
    prompt_arabizi: "chna7welek aya tfedhal mar7ba"
    reference_arabic: "شنحوالك آيا تفضل مرحبا"
    code_switch_terms: []

  - id: pharmacy_item
    prompt_arabizi: "emchi lel pharmacie w 9ollou a3tini el 9adhya elli wessaytek 3liha"
    reference_arabic: "امشي للفارماسي وقلو أعطيني القضية اللي وصيتك عليها"
    code_switch_terms:
      - ["فارماسي", "pharmacie"]

  - id: call_before_leaving
    prompt_arabizi: "9bal ma tokhrej a3melli appel"
    reference_arabic: "قبل ما تخرج اعملي آبال"
    code_switch_terms:
      - ["آبال", "ابال", "appel"]

  - id: call_when_available
