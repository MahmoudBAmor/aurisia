  - id: pharmacy_return
    prompt_arabizi: "emchi lel pharmacie w ija"
    reference_arabic: "امشي للفارماسي وإيجا"
    code_switch_terms:
      - ["فارماسي", "pharmacie"]

  - id: reverse
    prompt_arabizi: "tra a3mel marche arrière w arja3"
    reference_arabic: "ترا اعمل مارش أريار وارجع"
    code_switch_terms:
      - ["مارش أريار", "marche arrière", "marche arriere"]

  - id: find_mohsen
    prompt_arabizi: "assalemou 3alaykom, win nel9a si Mo7ssen"
    reference_arabic: "السلام عليكم وين نلقى سي محسن"
