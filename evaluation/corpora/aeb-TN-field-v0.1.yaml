  - id: how_did_you_know
    prompt_arabizi: "kifech 3raft li heka houa"
    reference_arabic: "كيفاش عرفت اللي هذا هو"
    code_switch_terms: []

  - id: introduce_names
    prompt_arabizi: "Ena esmi mahmoud w enti chessmek"
    reference_arabic: "أنا اسمي محمود وإنتي شسمك"
    code_switch_terms: []

  - id: clean_sink
    prompt_arabizi: "Barra nadhaf el lavabou"
    reference_arabic: "برا نظف اللافابو"
    code_switch_terms:
      - ["لافابو", "lavabo", "lavabou"]

  - id: pharmacy_panadol
    prompt_arabizi: "barra akhtaf rou7ek lel pharmacie jib bakkou panadol"
    reference_arabic: "برا اخطف روحك للفارماسي جيب باكو بانادول"
    code_switch_terms:
      - ["فارماسي", "الفارماسي", "لفارماسي", "للفارماسي", "pharmacie"]
      - ["باكو", "الباكو", "paquet"]
      - ["بانادول", "panadol", "panadole"]
